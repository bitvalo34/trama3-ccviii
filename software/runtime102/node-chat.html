<!doctype html>
<html lang="es">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRAMA 3 · Chat por nodo</title>
<style>
body{font:16px system-ui;max-width:960px;margin:24px auto;padding:0 16px;color:#192332}
button,select,textarea{font:inherit;padding:6px}textarea{width:100%;box-sizing:border-box;min-height:70px}
ul{padding-left:0;list-style:none}li{border-bottom:1px solid #ddd;padding:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
small{display:block;color:#445}#error{color:#a01818}details,form{margin:16px 0}
.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{text-align:left;padding:5px;border-bottom:1px solid #ddd}
[hidden]{display:none}
</style>
<h1 id="title">TRAMA 3</h1>
<p id="mode"></p>
<nav><span id="nodes" hidden><a href="/?node=A">Nodo A</a> · <a href="/?node=B">Nodo B</a> · </span><a id="log">Descargar JSONL original</a></nav>
<p id="state" aria-live="polite">Conectando…</p>
<p id="stats"></p>
<ul id="messages" aria-live="polite"></ul>
<form id="form"><label for="text">Mensaje</label><textarea id="text" maxlength="1024" required></textarea><button id="send" disabled>Enviar</button></form>
<p id="error" role="alert"></p>
<details id="events">
  <summary>Registro del protocolo</summary>
  <label>Tipo <select id="type"><option value="">Cualquiera</option></select></label>
  <label>Evento <select id="filter"><option value="">Todos</option><option value="ack">ACK/NACK</option><option value="error">Errores</option><option value="retry">Retransmisiones</option></select></label>
  <button id="reload">Actualizar</button> <button id="older" disabled>Anteriores</button>
  <p id="log-info" role="status"></p>
  <div class="scroll"><table><thead><tr><th>Hora UTC</th><th>Sentido</th><th>Evento</th><th>Trama</th><th>CRC recibido / calculado</th><th>Resultado</th><th>Intento</th><th>Estado</th></tr></thead><tbody id="rows"></tbody></table></div>
</details>
<script>
const query=new URLSearchParams(location.search);
const el=id=>document.getElementById(id);
const labels={pending:'Pendiente',sending:'En transmisión',waiting_ack:'Esperando ACK',confirmed:'Confirmado',failed:'Fallido',uncertain:'Entrega incierta',received:'Recibido'};
const types=['HELLO','HELLO_ACK','COMMIT','READY','START','LEN_LO','LEN_HI','DATA','END','ACK','NACK','RATE_CTRL','PERIOD_PART','PING','ERROR'];
for(const type of types)el('type').add(new Option(type,type));
el('log').href='/log?'+query;
let refreshing=false,posting=false,canSend=false,before=null,eventsRequest=0,messageVersion;
const button=()=>{el('send').disabled=posting||!canSend;};
async function json(url,options){
  const response=await fetch(url,options),data=await response.json();
  if(!response.ok)throw Error(data.error||response.status);
  return data;
}
async function refresh(){
  if(refreshing)return;
  refreshing=true;
  try{
    const s=await json('/state?'+query),simulation=s.origin==='simulation';
    el('title').textContent='TRAMA 3 · Nodo '+s.node;
    el('mode').textContent=simulation?'SIMULACIÓN — NO TRANSMISIÓN FÍSICA':'HARDWARE · '+s.board+' · '+s.hardware_revision;
    el('nodes').hidden=!simulation;
    const media=['C0 luz','C1 sonido','C2 nylon'].filter((_,i)=>s.available_mask&(1<<i));
    el('state').textContent=s.state+' · CRC-8/'+s.crc+' · '+s.encoding+' · '+media.join(' / ')+' · CLK '+s.frequency_hz+' Hz ('+s.clock+')';
    const issue=[...s.diagnostics].reverse().find(e=>e.reason||e.error||e.errors?.length);
    el('stats').textContent='Retransmisiones '+s.stats.retries+' · Duplicados '+s.stats.duplicates+(issue?' · Última incidencia '+(issue.reason||issue.error||issue.errors.join(', ')):'');
    canSend=s.can_send;
    const version=JSON.stringify(s.messages);
    if(version!==messageVersion){
      messageVersion=version;
      el('messages').replaceChildren(...s.messages.map(m=>{
        const li=document.createElement('li'),small=document.createElement('small');
        li.textContent=m.text;
        small.textContent=labels[m.status]+(m.error?' · '+m.error:'');
        li.append(small);return li;
      }));
    }
  }catch(error){canSend=false;el('state').textContent='Servidor no disponible · '+error.message;}
  finally{refreshing=false;button();}
}
el('form').onsubmit=async event=>{
  event.preventDefault();
  if(posting||!canSend)return;
  posting=true;button();el('error').textContent='';
  try{
    await json('/send?'+query,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:el('text').value})});
    el('text').value='';await refresh();
  }catch(error){el('error').textContent=error.message;}
  finally{posting=false;button();}
};
const hex=value=>value==null?'':value.toString(16).toUpperCase().padStart(2,'0');
async function showEvents(cursor=null){
  const version=++eventsRequest;
  const params=new URLSearchParams(query);
  params.set('type',el('type').value);params.set('filter',el('filter').value);
  if(cursor!==null)params.set('before',cursor);
  try{
    const result=await json('/events?'+params);
    if(version!==eventsRequest)return;
    before=result.before;el('older').disabled=before===null;
    el('log-info').textContent=result.entries.length?'Registros '+result.entries.at(-1).record+'–'+result.entries[0].record:'Sin eventos para este filtro.';
    el('rows').replaceChildren(...result.entries.map(e=>{
      const row=document.createElement('tr');
      const crc=e.crc==null?'':hex(e.crc)+' / '+(hex(e.crc_calculated)||'—');
      for(const value of [e.utc_system_unverified?.slice(11,23),{tx:'Salida',rx:'Entrada'}[e.direction],e.kind,e.type,crc,
        e.result||e.reason||e.trigger,e.attempt,e.confirmation]){
        const cell=row.insertCell();cell.textContent=value??'';
      }
      return row;
    }));
  }catch(error){if(version===eventsRequest)el('log-info').textContent=error.message;}
}
el('events').ontoggle=()=>{if(el('events').open)showEvents();};
for(const id of ['type','filter'])el(id).onchange=()=>showEvents();
el('reload').onclick=()=>showEvents();
el('older').onclick=()=>showEvents(before);
refresh();setInterval(refresh,750);
</script>
</html>
